<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ગુજરાતી ઘડિયાળ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;700;900&family=Hind+Vadodara:wght@400;700&family=Shrikhand&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--fg:#7a1f1f;--card:#ffffff;--ui:#333;--line:#e0d2b8;--fs:1;--font:'Noto Sans Gujarati',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card:#222;--ui:#eee;--line:#444}}
:root[data-theme="dark"]{--card:#222;--ui:#eee;--line:#444}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .3s}
.wrap{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.clock{text-align:center;padding:28px 12px;border-radius:28px;border:3px solid var(--fg)}
.day{font-size:calc(2.6rem*var(--fs));font-weight:900;line-height:1.3}
.time{font-size:calc(1.5rem*var(--fs));font-weight:700;line-height:1.5;margin:8px 0;opacity:.85}
.dig{font-size:calc(5.5rem*var(--fs));font-weight:900;line-height:1.2;margin:8px 0}
.date{font-size:calc(1.4rem*var(--fs));margin-top:8px}
.panel{background:var(--card);color:var(--ui);border:1px solid var(--line);border-radius:20px;padding:16px}
.panel h2{margin:0 0 12px;font-size:1.1rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;flex-wrap:wrap}
input[type=color]{width:48px;height:36px;border:none;background:none}
input[type=range]{width:50%}
select,button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ui)}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer;font-size:.7rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="clock" id="clock">
    <div class="day" id="day"></div>
    <div class="dig" id="dig"></div>
    <div class="time" id="time"></div>
    <div class="date" id="date"></div>
  </div>

  <div class="panel">
    <h2>⚙ કસ્ટમાઇઝ (Customize)</h2>
    <div class="row"><span>થીમ / Themes</span><div class="presets" id="presets"></div></div>
    <div class="row"><span>બેકગ્રાઉન્ડ રંગ / Background</span><input type="color" id="bg"></div>
    <div class="row"><span>અક્ષર રંગ / Text colour</span><input type="color" id="fg"></div>
    <div class="row"><span>અક્ષર મોટા / Text size</span><input type="range" id="fs" min="0.6" max="1.6" step="0.05"></div>
    <div class="row"><span>ફોન્ટ / Font</span>
      <select id="font">
        <option value="'Noto Sans Gujarati',sans-serif">Noto Sans</option>
        <option value="'Hind Vadodara',sans-serif">Hind Vadodara</option>
        <option value="'Shrikhand',serif">Shrikhand</option>
      </select></div>
    <div class="row"><span>શબ્દોમાં સમય બતાવો / Show time in words</span><input type="checkbox" id="showWords"></div>
    <div class="row"><span>તારીખ બતાવો / Show date</span><input type="checkbox" id="showDate"></div>
    <div class="row"><span>ફૂલ સ્ક્રીન / Fullscreen</span><button id="fsBtn">ખોલો</button></div>
    <div class="row"><span></span><button id="reset">રીસેટ / Reset</button></div>
  </div>
</div>

<script>
const N=["","એક","બે","ત્રણ","ચાર","પાંચ","છ","સાત","આઠ","નવ","દસ","અગિયાર","બાર","તેર","ચૌદ","પંદર","સોળ","સત્તર","અઢાર","ઓગણીસ","વીસ","એકવીસ","બાવીસ","ત્રેવીસ","ચોવીસ","પચ્ચીસ","છવ્વીસ","સત્તાવીસ","અઠ્ઠાવીસ","ઓગણત્રીસ","ત્રીસ","એકત્રીસ","બત્રીસ","તેત્રીસ","ચોત્રીસ","પાંત્રીસ","છત્રીસ","સાડત્રીસ","આડત્રીસ","ઓગણચાલીસ","ચાલીસ","એકતાલીસ","બેતાલીસ","ત્રેતાલીસ","ચુમ્માલીસ","પિસ્તાલીસ","છેતાલીસ","સુડતાલીસ","અડતાલીસ","ઓગણપચાસ","પચાસ","એકાવન","બાવન","ત્રેપન","ચોપન","પંચાવન","છપ્પન","સત્તાવન","અઠ્ઠાવન","ઓગણસાઠ"];
const DAYS=["રવિવાર","સોમવાર","મંગળવાર","બુધવાર","ગુરુવાર","શુક્રવાર","શનિવાર"];
const MON=["જાન્યુઆરી","ફેબ્રુઆરી","માર્ચ","એપ્રિલ","મે","જૂન","જુલાઈ","ઓગસ્ટ","સપ્ટેમ્બર","ઓક્ટોબર","નવેમ્બર","ડિસેમ્બર"];
const GD="૦૧૨૩૪૫૬૭૮૯";
const gd=s=>String(s).replace(/\d/g,d=>GD[d]);

function period(h){return h>=4&&h<12?"સવારે":h<16?"બપોરે":h<20?"સાંજે":"રાત્રે"}
function hr(h){return N[h%12||12]}

function words(d){
  const h=d.getHours(),m=d.getMinutes();
  const h1=(h+1)%24;
  let t;
  if(m===0) t=hr(h)+" વાગ્યા";
  else if(m===15) t="સવા "+hr(h);
  else if(m===30) t=(h%12===1)?"દોઢ":(h%12===2)?"અઢી":"સાડા "+hr(h);
  else if(m===45) t="પોણા "+hr(h1);
  else t=hr(h)+" વાગીને "+N[m]+" મિનિટ";
  const p=(m>=45)?period(h1):period(h);
  return p+" "+t;
}

const DEF={bg:"#fff7e6",fg:"#7a1f1f",fs:1,font:"'Noto Sans Gujarati',sans-serif",showWords:false,showDate:true};
const PRE=[["#fff7e6","#7a1f1f"],["#101820","#ffd166"],["#e8f5e9","#1b5e20"],["#e3f2fd","#0d47a1"],["#000000","#ffffff"],["#fff176","#222222"]];
let S={...DEF};
try{S={...DEF,...JSON.parse(localStorage.getItem("gclock")||"{}")}}catch(e){}
const $=id=>document.getElementById(id);

function apply(){
  const r=document.documentElement.style;
  r.setProperty("--bg",S.bg);r.setProperty("--fg",S.fg);r.setProperty("--fs",S.fs);r.setProperty("--font",S.font);
  $("bg").value=S.bg;$("fg").value=S.fg;$("fs").value=S.fs;$("font").value=S.font;
  $("showWords").checked=S.showWords;$("showDate").checked=S.showDate;
  $("time").style.display=S.showWords?"":"none";$("date").style.display=S.showDate?"":"none";
  try{localStorage.setItem("gclock",JSON.stringify(S))}catch(e){}
}
function tick(){
  const d=new Date();
  $("day").textContent=DAYS[d.getDay()];
  $("time").textContent=words(d);
  const h12=d.getHours()%12||12;
  $("dig").innerHTML='<small style="font-size:.3em;display:block">'+period(d.getHours())+'</small>'+gd(h12+":"+String(d.getMinutes()).padStart(2,"0"));
  $("date").textContent=gd(d.getDate())+" "+MON[d.getMonth()]+" "+gd(d.getFullYear());
}
PRE.forEach(([b,f])=>{const s=document.createElement("button");s.className="sw";s.style.background=b;s.style.color=f;s.textContent="અ";
  s.onclick=()=>{S.bg=b;S.fg=f;apply()};$("presets").appendChild(s)});
$("bg").oninput=e=>{S.bg=e.target.value;apply()};
$("fg").oninput=e=>{S.fg=e.target.value;apply()};
$("fs").oninput=e=>{S.fs=e.target.value;apply()};
$("font").onchange=e=>{S.font=e.target.value;apply()};
$("showWords").onchange=e=>{S.showWords=e.target.checked;apply()};
$("showDate").onchange=e=>{S.showDate=e.target.checked;apply()};
$("reset").onclick=()=>{S={...DEF};apply()};
$("fsBtn").onclick=()=>{try{document.documentElement.requestFullscreen()}catch(e){}};
apply();tick();setInterval(tick,1000);
</script>
</body>
</html>
